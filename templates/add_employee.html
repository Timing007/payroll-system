{% extends "base.html" %}
{% block title %}Add Employee{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="/employees" class="btn btn-outline-secondary btn-sm me-3"><i class="bi bi-arrow-left"></i></a>
  <h2 class="fw-bold mb-0"><i class="bi bi-person-plus me-2 text-primary"></i>Add Employee</h2>
</div>

<div class="card" style="max-width: 680px;">
  <div class="card-body">
    <form method="POST" action="/employees/add">
      <!-- Common fields -->
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Employee ID</label>
          <input type="text" name="emp_id" class="form-control" placeholder="e.g. EMP007" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Full Name</label>
          <input type="text" name="name" class="form-control" placeholder="e.g. Jane Doe" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Department</label>
          <input type="text" name="department" class="form-control" placeholder="e.g. Engineering" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Employee Type</label>
          <select name="emp_type" id="emp_type" class="form-select" required>
            <option value="full_time">Full Time</option>
            <option value="part_time">Part Time</option>
            <option value="contract">Contract</option>
          </select>
        </div>
      </div>

      <!-- Full Time fields -->
      <div id="fields_full_time" class="border rounded p-3 mb-3">
        <h6 class="text-muted mb-3">Full-Time Details</h6>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Monthly Base Pay (₹)</label>
            <input type="number" name="base_pay" class="form-control" min="0" step="0.01" placeholder="80000" />
          </div>
          <div class="col-md-3">
            <label class="form-label">HRA %</label>
            <input type="number" name="hra_pct" class="form-control" min="0" max="100" step="0.01" placeholder="20" />
          </div>
          <div class="col-md-3">
            <label class="form-label">DA %</label>
            <input type="number" name="da_pct" class="form-control" min="0" max="100" step="0.01" placeholder="10" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Tax %</label>
            <input type="number" name="tax_pct" class="form-control" min="0" max="100" step="0.01" placeholder="10" />
          </div>
          <div class="col-md-3">
            <label class="form-label">PF %</label>
            <input type="number" name="pf_pct" class="form-control" min="0" max="100" step="0.01" placeholder="12" />
          </div>
        </div>
      </div>

      <!-- Part Time fields -->
      <div id="fields_part_time" class="border rounded p-3 mb-3 d-none">
        <h6 class="text-muted mb-3">Part-Time Details</h6>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Hourly Rate (₹)</label>
            <input type="number" name="hourly_rate" class="form-control" min="0" step="0.01" placeholder="250" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Hours Worked</label>
            <input type="number" name="hours_worked" class="form-control" min="0" step="0.5" placeholder="45" />
          </div>
        </div>
      </div>

      <!-- Contract fields -->
      <div id="fields_contract" class="border rounded p-3 mb-3 d-none">
        <h6 class="text-muted mb-3">Contract Details</h6>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Project Fee (₹)</label>
            <input type="number" name="project_fee" class="form-control" min="0" step="0.01" placeholder="120000" />
          </div>
        </div>
      </div>

      <div class="d-flex gap-2 mt-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle me-1"></i>Add Employee</button>
        <a href="/employees" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  function toggleFields() {
    const type = document.getElementById('emp_type').value;
    document.getElementById('fields_full_time').classList.toggle('d-none', type !== 'full_time');
    document.getElementById('fields_part_time').classList.toggle('d-none', type !== 'part_time');
    document.getElementById('fields_contract').classList.toggle('d-none', type !== 'contract');
  }
  document.getElementById('emp_type').addEventListener('change', toggleFields);
  toggleFields();
</script>
{% endblock %}
